version: '3.9'

services:
  db:
    image: postgres:15
    container_name: insightly-db
    environment:
      POSTGRES_DB: insightly
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: insightly-backend
    restart: always
    env_file:
      - .env
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "npx prisma generate && npx prisma migrate deploy && node dist/main"
    volumes:
      - ./prisma:/app/prisma # volume persistente do Prisma
      - ./node_modules:/app/node_modules

  frontend:
    build:
      context: ../insightly-frontend
      dockerfile: Dockerfile
    container_name: insightly-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://18.171.166.199:4000
    depends_on:
      - backend

volumes:
  db-data:
